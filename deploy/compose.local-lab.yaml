# Local-only overlay, applied after compose.yaml and compose.lab.yaml.
# Compose 2.24.4+ is required for !override. Build the site before starting.
services:
  gateway:
    volumes:
      - ${LOCAL_LAB_DIR:?}/streamotter.production.json:/app/apps/field-station/streamotter.production.json:ro
  caddy:
    ports: !override
      - "127.0.0.1:8443:443"
    volumes:
      - ./Caddyfile.local-lab:/etc/caddy/Caddyfile:ro
      - ../apps/site/dist:/srv/site:ro
