name: Deploy static site
on:
  workflow_dispatch:
    inputs:
      destination:
        description: Preview first; production requires release acceptance
        required: true
        default: preview
        type: choice
        options: [preview, production]
permissions:
  contents: read
concurrency:
  group: site-${{ inputs.destination }}
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.LONTRA_SITE_ENABLED == 'true'
    environment: ${{ inputs.destination == 'production' && 'production' || 'preview' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PUBLIC_FIELD_STATION_ORIGIN: https://demo.streamotter.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      # Main is the Pages project's configured production branch.
      PAGES_BRANCH: ${{ inputs.destination == 'production' && 'main' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$PAGES_PROJECT"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @lontra-creek/site
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/site/dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ env.PAGES_BRANCH }}
