# The relay-cut spike (E2.0): one Failure Lab bench and its proxy beside the demo
# host's stack, for .github/workflows/lab-spike.yml. Not the Lab's deployment.
#
#   docker compose -f deploy/compose.yaml -f deploy/compose.lab-spike.yaml --env-file <env> up -d --wait
#
# The env file also needs KAFKA_LAB_PASSWORD (the benches' SCRAM user) and
# LAB_RELAY_TOKEN (the proxy's own control token — separate from
# FIELD_STATION_SERVICE_TOKEN so the relay control can't also read every notebook
# through the field station's internal API), and the broker's certificate for the
# name lab-1-kafka (deploy/make-certs.sh kafka <dir> lab-1-kafka).
#
#   field-station ──kafka:9094──▶ kafka      publishes the creek, and bench 1's copy (lab-1.*)
#   gateway ───────kafka:9094──▶ kafka      the demo host's gateway, untouched by the cut
#   lab-1 ──lab-1-kafka:9101──▶ lab-1-kafka (the proxy) ──kafka:9101──▶ kafka's BENCH1 listener,
#                                            advertised as lab-1-kafka:9101
#
# For the test only, the bench's gateway and the proxy's control API are published
# on the runner's loopback. In the Lab, visitors reach benches through Caddy and
# the field station calls the proxy on the compose network.

services:
  kafka:
    environment:
      KAFKA_BENCH_LISTENERS: lab-1-kafka:9101
      KAFKA_LAB_USERNAME: lab
      KAFKA_LAB_PASSWORD: ${KAFKA_LAB_PASSWORD:?}

  field-station:
    environment:
      FIELD_LAB_BENCHES: "1"
      LAB_BENCH_API_URLS: http://lab-1:7420
      LAB_BENCH_1_SERVICE_TOKEN: ${LAB_BENCH_1_SERVICE_TOKEN:?}

  lab-1-kafka:
    image: ${LONTRA_IMAGE:?set LONTRA_IMAGE to the image built from deploy/Dockerfile}
    init: true
    restart: unless-stopped
    command: ["node", "src/lab/proxy-main.ts"]
    environment:
      NODE_ENV: production
      LAB_BENCH: "1"
      LAB_BENCH_1_RELAY_TOKEN: ${LAB_BENCH_1_RELAY_TOKEN:?}
    ports:
      - "127.0.0.1:9180:9180"
    depends_on:
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:net').connect(9180, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 6
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

  lab-1:
    image: ${LONTRA_IMAGE:?set LONTRA_IMAGE to the image built from deploy/Dockerfile}
    init: true
    restart: unless-stopped
    command: ["node", "src/lab/bench-main.ts"]
    environment:
      NODE_ENV: production
      LAB_BENCH: "1"
      KAFKA_LAB_USERNAME: lab
      KAFKA_LAB_PASSWORD: ${KAFKA_LAB_PASSWORD:?}
      LAB_BENCH_1_SERVICE_TOKEN: ${LAB_BENCH_1_SERVICE_TOKEN:?}
      LAB_BENCH_1_RELAY_TOKEN: ${LAB_BENCH_1_RELAY_TOKEN:?}
      LAB_SNAPSHOT_ORIGIN: http://field-station:7410
      SITE_ORIGIN: ${SITE_ORIGIN:-https://streamotter.app}
    volumes:
      - ${LONTRA_SECRETS:?}/kafka/ca.pem:/etc/lontra/kafka/ca.pem:ro
    ports:
      - "127.0.0.1:7500:7400"
    depends_on:
      field-station: { condition: service_healthy }
      lab-1-kafka: { condition: service_healthy }
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:net').connect(7400, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 45s
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
