# Workbench sandbox overlay (LC11-ADR-04, sandbox contract §§1, 9, 10). Nothing here
# publishes a port: Caddy routes /api/sandbox/* to the field station and only
# /sandbox/N/socket.io/* to slot N's gateway (sandbox:760N); the sandbox API (7620)
# and each slot's management listener (loopback inside the container) stay private.
#
#   docker compose -f deploy/compose.yaml -f deploy/compose.lab.yaml -f deploy/compose.sandbox.yaml --env-file <env> up -d --wait
#
# The env file needs SANDBOX_SERVICE_TOKEN (deploy/make-secrets.sh writes it; for an
# older env file see deploy/OPERATIONS.md, Workbench sandbox overlay).
x-sandbox-node: &sandbox-node
  image: ${LONTRA_IMAGE:?}
  init: true
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }
services:
  field-station:
    environment:
      SANDBOX_API_URL: http://sandbox:7620
      SANDBOX_SERVICE_TOKEN: ${SANDBOX_SERVICE_TOKEN:?}
      SANDBOX_SLOTS: ${SANDBOX_SLOTS:-3}
      SANDBOX_LEASE_SECONDS: ${SANDBOX_LEASE_SECONDS:-600}
  caddy:
    environment:
      SITE_ORIGIN: ${SITE_ORIGIN:-https://streamotter.dev}

  sandbox:
    <<: *sandbox-node
    command: ["node", "src/sandbox/sandbox-main.ts"]
    # SANDBOX_*, SITE_ORIGIN, and NODE_ENV only: the service's environment is an allowlist,
    # and any other variable (FIELD_STATION_*, Kafka credentials, Lab tokens) stops it.
    environment:
      NODE_ENV: production
      SANDBOX_SERVICE_TOKEN: ${SANDBOX_SERVICE_TOKEN:?}
      SANDBOX_SLOTS: ${SANDBOX_SLOTS:-3}
      SITE_ORIGIN: ${SITE_ORIGIN:-https://streamotter.dev}
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7620/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
