name: Shared host adapter
on:
  pull_request:
    paths: ['deploy/**', '.github/workflows/shared-host.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shared-host-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rehearsal:
    name: Shared host (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: lontra-creek:shared-ci
          cache-from: type=gha,scope=stack-${{ matrix.arch }}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: python3 -m unittest discover -s deploy/shared-host -p 'test_*.py' -v
      - name: Rehearse isolated shared routing, limits and backup hooks
        run: deploy/test/shared-host/rehearse.sh
      - name: Preserve resource observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-host-resources-${{ matrix.arch }}
          path: ${{ runner.temp }}/lontra-shared-resources.jsonl
          if-no-files-found: ignore
