# The demo host: Caddy, the StreamOtter gateway, the field station, and Kafka.
# Only Caddy publishes a port (443). Everything else talks on this project's network.
#
#   docker compose -f deploy/compose.yaml --env-file <secrets env> up -d --wait
#
# The env file (deploy/make-secrets.sh) holds FIELD_STATION_SECRET,
# FIELD_STATION_SERVICE_TOKEN, KAFKA_GATEWAY_PASSWORD, and
# KAFKA_FIELD_STATION_PASSWORD, plus the settings below that have no default:
#   LONTRA_IMAGE    the image built from deploy/Dockerfile
#   LONTRA_SECRETS  a directory with kafka/ (deploy/make-certs.sh kafka) and origin/
#                   (cert.pem and key.pem: the Cloudflare origin certificate)
#   FIELD_EPOCH     when the hosted study began (ISO 8601); fixed for the life of a generation
# and optionally KAFKA_AUTHORIZATION (deploy/kafka/start.sh): "acl" enforces each Kafka
# user's least-privilege ACLs, "migrate" is the first step of moving an existing broker
# there (deploy/OPERATIONS.md, Kafka authorization), and "none", the default here, leaves
# the broker without an authorizer. CI and local stacks set "acl"; the hosted broker
# stays at "none" until its owner approves the migration.
name: lontra-creek

x-node: &node
  image: ${LONTRA_IMAGE:?set LONTRA_IMAGE to the image built from deploy/Dockerfile}
  init: true
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }

services:
  kafka:
    image: apache/kafka:4.1.2
    entrypoint: ["/bin/bash", "/opt/lontra/start.sh"]
    environment:
      # A fixed, pre-touched heap: it also keeps the host above Oracle's idle-memory threshold
      # (docs/PLAN.md, Budget protection). Without AlwaysPreTouch the JVM reserves the heap but
      # holds only what it has used: 452 MiB resident in CI.
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms3g -Xmx3g -XX:+AlwaysPreTouch}
      KAFKA_GATEWAY_USERNAME: gateway
      KAFKA_GATEWAY_PASSWORD: ${KAFKA_GATEWAY_PASSWORD:?}
      KAFKA_FIELD_STATION_USERNAME: field-station
      KAFKA_FIELD_STATION_PASSWORD: ${KAFKA_FIELD_STATION_PASSWORD:?}
      KAFKA_AUTHORIZATION: ${KAFKA_AUTHORIZATION:-none}
    volumes:
      - ./kafka/start.sh:/opt/lontra/start.sh:ro
      - ${LONTRA_SECRETS:?}/kafka:/etc/lontra/kafka:ro
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # Healthy once the broker answers and, with authorization on, its ACLs are in place
      # (start.sh writes the ready file). The check's own JVM gets a small heap, not the broker's.
      test: ["CMD-SHELL", "test -f /tmp/lontra-kafka.ready && KAFKA_HEAP_OPTS=-Xmx128m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 > /dev/null"]
      interval: 10s
      timeout: 20s
      retries: 12
      # A new volume's ACL bootstrap runs a dozen tool JVMs: about 4 minutes at the shared
      # host's 0.35 CPU (compose.shared.yaml). Checks still pass as soon as it is ready.
      start_period: 300s
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

  field-station:
    <<: *node
    command: ["node", "--disable-warning=TimeoutNegativeWarning", "src/server/main.ts"]
    environment:
      NODE_ENV: production
      FIELD_HOST: 0.0.0.0
      KAFKA_BROKERS: kafka:9094
      KAFKA_CA_FILE: /etc/lontra/kafka/ca.pem
      KAFKA_FIELD_STATION_USERNAME: field-station
      KAFKA_FIELD_STATION_PASSWORD: ${KAFKA_FIELD_STATION_PASSWORD:?}
      FIELD_STATION_SECRET: ${FIELD_STATION_SECRET:?}
      FIELD_STATION_SERVICE_TOKEN: ${FIELD_STATION_SERVICE_TOKEN:?}
      FIELD_DATA_DIR: /var/lib/lontra
      FIELD_EPOCH: ${FIELD_EPOCH:?set FIELD_EPOCH to when the hosted study began}
      FIELD_TICK_MS: ${FIELD_TICK_MS:-2000}
      FIELD_GENERATION: ${FIELD_GENERATION:-1}
      SITE_ORIGIN: ${SITE_ORIGIN:-https://streamotter.dev}
      # Pup Patrol's origin (three /api routes, no credentials); set it empty to turn the game off.
      GAME_ORIGIN: ${GAME_ORIGIN-https://lontracreek.dev}
      GATEWAY_PUBLIC_ORIGIN: ${GATEWAY_PUBLIC_ORIGIN:-https://demo.streamotter.dev}
    volumes:
      - ${LONTRA_SECRETS:?}/kafka/ca.pem:/etc/lontra/kafka/ca.pem:ro
      - field-data:/var/lib/lontra
    depends_on:
      kafka: { condition: service_healthy }
    healthcheck:
      # Healthy once caught up to the wall clock and Kafka has acknowledged its views.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7402/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  gateway:
    <<: *node
    # Exactly one gateway per project (StreamOtter V1). The field station creates the topics it consumes.
    command: ["node", "/app/node_modules/streamotter/bin/streamotter.js", "start", "--config", "streamotter.production.json", "--handlers", "dist/kafka-handlers.js"]
    environment:
      NODE_ENV: production
      KAFKA_GATEWAY_USERNAME: gateway
      KAFKA_GATEWAY_PASSWORD: ${KAFKA_GATEWAY_PASSWORD:?}
      FIELD_STATION_SECRET: ${FIELD_STATION_SECRET:?}
      FIELD_STATION_SERVICE_TOKEN: ${FIELD_STATION_SERVICE_TOKEN:?}
      FIELD_STATION_INTERNAL_URL: http://field-station:7410
    volumes:
      - ${LONTRA_SECRETS:?}/kafka/ca.pem:/etc/lontra/kafka/ca.pem:ro
    depends_on:
      field-station: { condition: service_healthy }
    # A graceful stop takes up to 10 seconds; after a crash, Kafka holds the old member for 30.
    stop_grace_period: 15s
    healthcheck:
      # V1 has no health endpoint in production: check that the port accepts connections.
      test: ["CMD", "node", "-e", "require('node:net').connect(7400, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 45s

  caddy:
    image: caddy:2.11.4-alpine
    ports:
      - "443:443"
    environment:
      DEMO_HOST: ${DEMO_HOST:-demo.streamotter.dev}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${LONTRA_SECRETS:?}/origin:/etc/caddy/origin:ro
      - caddy-data:/data
    depends_on:
      gateway: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

volumes:
  kafka-data:
  field-data:
  caddy-data:
